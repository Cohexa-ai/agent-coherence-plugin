# Report when `dev`'s lockfile falls behind `main`'s.
#
# Dependabot builds its dependency graph from the DEFAULT branch only, so a
# security advisory raises one alert and one PR, both scoped to `main`, and
# `dev` is never examined — even though every feature branch is cut from it.
# The alert then closes on the `main` merge while `dev` is still running the
# vulnerable version. That has happened twice on js-yaml: alert #5 closed four
# seconds after PR #102 merged and forty-one minutes before `dev` was patched;
# alert #6 closed five seconds after PR #128 merged.
#
# Triggering on push to `main` catches the drift at the moment it is created —
# a dependabot bump landing on the default branch — rather than at release
# time, where the remedy would cost a spent version number.
#
# `dev` is in the trigger list for two reasons. A push-triggered workflow runs
# the definition on the ref that was pushed, so a file that only ever fires on
# `main` stays inert until it reaches `main` — which, for a change merged to
# `dev`, means the next release. Listing `dev` makes the guard live the moment
# this merges, on the branch it is about. And a push to `dev` is itself a
# legitimate moment to ask the question: a forward-merge that was supposed to
# clear the drift is a push to `dev`, and this is what proves it worked.
#
# This job blocks nothing: it is a visible red check on the commit it examined.
name: lockfile-drift

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

# The comparison always reads the tips of `main` and `dev`, never the pushed
# commit, so a queued older run can only re-answer a question the newer run is
# already answering with fresher inputs.
concurrency:
  group: lockfile-drift
  cancel-in-progress: true

jobs:
  drift:
    name: dev lockfile is not behind main
    runs-on: ubuntu-latest
    # Two `gh api` calls against a 68 KB file each. Anything approaching this
    # is hung, not slow, and the default six hours would hold a runner for it.
    timeout-minutes: 5
    steps:
      # Pinned to the same SHA as ci.yml: a mutable tag on the action that
      # fetches the code a security check then reads is the one place in this
      # file where a supply-chain substitution would go unnoticed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # The check shells out to `gh api` for both branches' package-lock.json
      # and needs no dependencies of its own, so there is no setup-node or
      # npm ci step: the runner's Node is enough and `tools/*.js` imports only
      # Node builtins by design.
      - name: Check dev against main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/check_lockfile_drift.js
